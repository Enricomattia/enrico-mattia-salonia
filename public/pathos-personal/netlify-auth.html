<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2lcv8sCcd4O0FIcWy0GJIsexbABypcyMu/MzwEHbnv0='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Connect Πathos to Netlify</title><style>body{max-width:36rem;margin:12vh auto;padding:24px;font:16px/1.6 system-ui;color:#303734;background:#f8f9f6}h1{font:32px Georgia,serif}</style></head><body><h1>Connect Πathos</h1><p id="connectionStatus" role="status">Finishing the Netlify connection…</p><script>// This callback never loads the archive or saves credentials.
(()=>{
  const values=new URLSearchParams(location.hash.slice(1));
  history.replaceState(null,'',location.pathname);
  const token=values.get('access_token'),state=values.get('state');
  if(!window.opener||!state||state.length>200){document.getElementById('connectionStatus').textContent='Open Connect Netlify from Πathos again and keep that window open.';return;}
  const valid=typeof token==='string'&&/^[A-Za-z0-9._~+\/=-]{10,8192}$/.test(token);
  window.opener.postMessage({type:'pathos-netlify-auth',state,token:valid?token:null,error:valid?'':'Netlify connection was cancelled or refused.'},location.origin);
  document.getElementById('connectionStatus').textContent=valid?'Connected. Return to Πathos.':'Connection cancelled. Return to Πathos to try again.';
  window.close();
})();</script></body></html>
